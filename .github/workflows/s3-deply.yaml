name: CI/CD to S3 Static Website

on:
  push:
    branches:
      - main
  # Allows manual runs via the GitHub Actions UI
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Define the environment variables, using your bucket name directly
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: xasan.net  # ⬅️ Replaced with your bucket name
      SOURCE_DIR: './' 

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    # *** Keep the optional build step commented out unless you need it ***
    # - name: Install Dependencies and Build Project
    #   run: |
    #     npm install
    #     npm run build
    #   env:
    #     SOURCE_DIR: './build' 

    - name: Configure AWS Credentials for Deployment
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy files to S3 bucket
      run: |
        echo "Deploying files from ${{ env.SOURCE_DIR }} to s3://${{ env.S3_BUCKET }}"
        # This command synchronizes files and deletes old ones (--delete)
        aws s3 sync ${{ env.SOURCE_DIR }} s3://${{ env.S3_BUCKET }} \
          --delete \
          --acl public-read \
          --cache-control 'max-age=300' 

    - name: Invalidate CloudFront Cache (If Used)
      # 🚨 LOGIC FIX: Invalidation should run if deployment SUCCEEDED (if: success()), not failed.
      # This step is only needed if you are using CloudFront in front of S3.
      # If you are not using CloudFront, you can delete this whole step.
      if: success() # Run this step ONLY if the S3 deployment step successfully completed
      run: |
        echo "CloudFront Invalidation is required to see new content immediately."
        # IMPORTANT: Replace YOUR_CLOUDFRONT_DISTRIBUTION_ID with the actual ID 
        # (e.g., E123ABCDEFG789) and ensure this ID is stored as a GitHub secret 
        # or environment variable if you activate this command.
        # aws cloudfront create-invalidation --distribution-id YOUR_CLOUDFRONT_DISTRIBUTION_ID --paths "/*"