name: Deploy Vite site to S3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: xasan.net
    defaults:
      run:
        working-directory: Portfolio_v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Long cache for assets (exclude HTML)
      - name: Sync assets
        run: |
          aws s3 sync dist s3://${{ env.S3_BUCKET }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      # No-cache for index.html (SPA refreshes)
      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      # Optional: CloudFront invalidation if you use CF in front of S3
      # - name: Invalidate CloudFront
      #   if: success()
      #   run: |
      #     aws cloudfront create-invalidation \
      #       --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
      #       --paths "/*"